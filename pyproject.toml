[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decision-intelligence-mcp"
version = "0.1.6"
description = "MCP server: 5,000 years of military strategy and philosophy — Napoleon, Sun Tzu, Clausewitz, Alexander, Hannibal, Genghis Khan, Shaka Zulu, Caesar. All public domain."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp","strategy","military","napoleon","sun-tzu","clausewitz","philosophy","history","public-domain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["fastmcp>=2.0.0"]
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/gabrielmahia/decision-intelligence-mcp"
Repository = "https://github.com/gabrielmahia/decision-intelligence-mcp"
"MCP Servers" = "https://glama.ai/mcp/servers?query=author:gabrielmahia"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"

[project.scripts]
decision-intelligence-mcp = "classical_strategy_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/classical_strategy_mcp"]
